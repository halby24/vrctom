[package]
name = "vrctom"
version.workspace = true
edition.workspace = true

[dependencies]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tempfile = "3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
opfs = "0.3"
futures = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Crypto"] }

[dev-dependencies]
futures = "0.3"
