[package]
name = "vrctom"
version.workspace = true
edition.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# glTF JSON型とシリアライズだけを使い、import機能（画像デコーダ）は入れない。
# `extras` はモーフターゲット名（`targetNames`）の出力に使う。
gltf = { version = "1.4", default-features = false, features = ["extensions", "extras", "names"] }
yaml_serde = "0.10"
# wasmでも使う純粋パーサのため、zlib展開はrust_backendで共通依存にする。
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# MMD標準フェイシャルモーフ名の突き合わせに使うNFKC正規化。純Rustでwasmでも動く。
unicode-normalization = "0.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tempfile = "3"
tar = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
opfs = "0.3"
futures = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Crypto"] }

# tar/tempfileは通常のnative依存としてhostテストから使えるため、
# ここには置かない。wasm向けの依存ツリーに混ざらないようにする。
# flate2は共通依存に移したため、テストでも直接使える。
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
futures = "0.3"
