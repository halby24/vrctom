[package]
name = "vrctom"
version.workspace = true
edition.workspace = true

[dependencies]
tar = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# glTF JSON型とシリアライズだけを使い、import機能（画像デコーダ）は入れない。
# `extras` はモーフターゲット名（`targetNames`）の出力に使う。
gltf = { version = "1.4", default-features = false, features = ["extensions", "extras", "names"] }
yaml_serde = "0.10"
# wasmでも使う純粋パーサのため、zlib展開はrust_backendで共通依存にする。
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# MMD標準フェイシャルモーフ名の突き合わせに使うNFKC正規化。純Rustでwasmでも動く。
unicode-normalization = "0.1"
# Unity 2019.3 以降のFBX取り込みが生成する fileID（XXH64・seed 0）。
# 純Rustでありwasmでも使う。
xxhash-rust = { version = "0.8", default-features = false, features = ["xxh64"] }
# テクスチャのベイクで使う画像コーデック。wasmでも同じ写像・ベイクを通す。
# PNGは8bit RGBA/RGB・グレースケール・16bit・パレットを受け、JPEGは
# グレースケールとRGB（CMYKは対象外）を受ける。どちらも純Rustである。
png = "0.18"
zune-jpeg = "0.5"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tempfile = "3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
opfs = "0.3"
futures = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Crypto"] }

# tarは展開の共通核で使うため共通依存に置く。wasmでも動く。
# tempfileはnative退避だけで使うためnativeのままにする。
# flate2は共通依存に移したため、テストでも直接使える。
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
futures = "0.3"
