[package]
name = "vrctom-wasm"
version.workspace = true
edition.workspace = true
description = ".unitypackage / FBX を VRM 1.0 に変換するブラウザ向け Wasm バインディング"
license = "MIT"
repository = "https://github.com/halby24/vrctom"
homepage = "https://github.com/halby24/vrctom"
documentation = "https://github.com/halby24/vrctom"
readme = "README.md"
keywords = ["vrm", "vrchat", "unity", "fbx", "wasm"]
categories = ["wasm", "graphics"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
vrctom.workspace = true
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
flate2 = "1"
